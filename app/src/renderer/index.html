<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Pet</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      body.tiny #bubble,
      body.tiny #team {
        display: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #bubble {
        position: fixed;
        transform: translate(-50%, -100%);
        padding: 3px 9px;
        border-radius: 10px;
        background: rgba(20, 20, 28, 0.78);
        color: #fff;
        font-size: 11px;
        line-height: 1.35;
        white-space: pre-line;
        text-align: center;
        width: max-content;
        max-width: 86vw;
        overflow-wrap: anywhere;
        pointer-events: none;
        left: 50%;
        top: 12px;
      }
      /* Waiting on you: the bubble is the one thing on screen asking for you. */
      body[data-state='permission'] #bubble {
        background: rgba(222, 60, 50, 0.94);
        font-weight: 600;
        box-shadow: 0 0 0 0 rgba(222, 60, 50, 0.6);
        animation: ask 1.6s ease-out infinite;
      }
      body[data-state='error'] #bubble {
        background: rgba(170, 70, 20, 0.9);
      }
      @keyframes ask {
        0% { box-shadow: 0 0 0 0 rgba(222, 60, 50, 0.55); }
        70% { box-shadow: 0 0 0 9px rgba(222, 60, 50, 0); }
        100% { box-shadow: 0 0 0 0 rgba(222, 60, 50, 0); }
      }
      /* The team strip: subagents and other sessions, beside him. */
      #team {
        position: fixed;
        left: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: 36vw;
        pointer-events: none;
        font-size: 10px;
      }
      #team.right {
        left: auto;
        right: 4px;
        align-items: flex-end;
      }
      #team[data-more]:not([data-more=''])::after {
        content: attr(data-more);
        color: rgba(255, 255, 255, 0.85);
        background: rgba(20, 20, 28, 0.6);
        border-radius: 8px;
        padding: 0 6px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: 2px 7px 2px 3px;
        border-radius: 12px;
        background: rgba(20, 20, 28, 0.72);
        color: #fff;
        border: 1px solid rgba(120, 170, 255, 0.55);
        animation: chip-in 0.35s cubic-bezier(0.3, 1.6, 0.5, 1);
        transition: opacity 0.6s, transform 0.6s;
      }
      .chip .icon {
        display: inline-block;
        font-size: 13px;
        animation: bob 1.1s ease-in-out infinite;
      }
      .chip .text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.2;
      }
      .chip b {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip i {
        font-style: normal;
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip[data-state='thinking'] { border-color: rgba(190, 150, 255, 0.6); }
      .chip[data-state='permission'] {
        border-color: rgba(255, 90, 80, 0.95);
        background: rgba(120, 24, 20, 0.85);
        animation: throb 1.2s ease-in-out infinite;
      }
      .chip[data-state='done'],
      .chip.done { border-color: rgba(110, 220, 140, 0.8); }
      .chip[data-state='error'] { border-color: rgba(255, 150, 60, 0.9); }
      .chip.done { opacity: 0; transform: translateY(-6px); transition-delay: 1.6s; }
      .chip.done .icon { animation: none; }
      @keyframes chip-in {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      @keyframes throb {
        50% { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" hidden></div>
    <div id="team" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
