<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Pet</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      }
      body.tiny #bubble {
        display: none;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #bubble {
        position: fixed;
        transform: translate(-50%, -100%);
        padding: 3px 9px;
        border-radius: 10px;
        background: rgba(20, 20, 28, 0.78);
        color: #fff;
        font-size: 11px;
        white-space: nowrap;
        pointer-events: none;
        left: 50%;
        top: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
